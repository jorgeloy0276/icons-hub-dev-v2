<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icons Hub</title>
  <link rel="stylesheet" href="newtab.css">
</head>

<body>
  <div class="glow">
    <i></i>
    <i></i>
  </div>

  <main>
    <h1 id="title" spellcheck="false">Icons-Hub-Jorgeloy Version 1.0</h1>
    <p class="sub" id="sub">El punto inicial desde el que despegas hacia cualquier sitio.</p>
    <div class="grid" id="grid"></div>
  </main>

  <div class="bar">
    <span id="tools" style="display:none;gap:8px;margin-right:8px">
      <button class="btn" id="restBtn">Restaurar originales</button>
      <button class="btn" id="expBtn">Exportar</button>
      <button class="btn" id="impBtn">Importar</button>
    </span>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
    <button class="btn" id="editBtn">Editar</button>
  </div>

  <div class="ov" id="ov">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="dt">
      <h2 id="dt">Nuevo acceso</h2>
      <label>Nombre<input id="fName" maxlength="24" placeholder="Ej. LinkedIn"></label>
      <label>Dirección web<input id="fUrl" placeholder="linkedin.com"></label>
      <label>Icono: vacío = logo automático. O un emoji, una letra, o una ruta como img/linkedin.svg
        <input id="fIco" maxlength="120" placeholder="(vacío)"></label>
      <div class="sw" id="sw"></div>
      <div class="row">
        <button class="btn" id="cancel">Cancelar</button>
        <button class="btn go" id="save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- En extensiones (Manifest V3) NO se permite JavaScript dentro del HTML: va en archivo aparte -->
  <script src="newtab.js"></script>
</body>

</html>
